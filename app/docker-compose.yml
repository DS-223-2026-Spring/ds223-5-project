version: '3.8'

services:
  db:
    image: postgres:17
    container_name: db
    environment:
      - POSTGRES_DB=imp
      - POSTGRES_USER=imp_user
      - POSTGRES_PASSWORD=imp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: back
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=imp
      - DB_USER=imp_user
      - DB_PASSWORD=imp_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); exit(0 if r.get('status')=='healthy' else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seed:
    build:
      context: ./ds
      dockerfile: Dockerfile
    container_name: seed
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=imp
      - DB_USER=imp_user
      - DB_PASSWORD=imp_password
      - MATCH_API_BASE=http://back:8000
    volumes:
      - ./backend:/app/backend
      - ./db/seed:/app/db/seed
    working_dir: /app
    command: ["python", "/app/db/seed/seed_synthetic.py"]
    depends_on:
      db:
        condition: service_healthy
      back:
        condition: service_healthy

  ds:
    build:
      context: ./ds
      dockerfile: Dockerfile
    container_name: ds
    working_dir: /app/ds
    volumes:
      - ./ds:/app/ds
    command: python eda_modeling.py

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    ports:
      - "8501:8501"
    volumes:
      - ./front:/app
    depends_on:
      - back

volumes:
  postgres_data: